<!doctype html>
<html lang="pl" data-dev="{{DEV}}" data-version="{{VERSION}}">
  <head>
    <meta charset="utf-8" />
    <base href="{{BASE}}" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Biblioteczka" />
    <meta name="application-name" content="Biblioteczka" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Domowa biblioteczka: książki, serie i autorzy – wspólna dla całej rodziny." />
    <title>Biblioteczka</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237363FA'/%3E%3Cstop offset='1' stop-color='%234C38CC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='7' y='8' width='5' height='16' rx='1.2' fill='%23fff'/%3E%3Crect x='13.5' y='8' width='5' height='16' rx='1.2' fill='%23fff' fill-opacity='.85'/%3E%3Crect x='20' y='8.6' width='4.6' height='15.4' rx='1.2' fill='%23fff' fill-opacity='.7' transform='rotate(-13 22.3 16.3)'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="static/css/app.css?v={{VERSION}}" />
    <link rel="stylesheet" href="static/css/book-detail.css?v={{VERSION}}" />
    <link rel="modulepreload" href="static/vendor/preact-htm.js" />
    <script type="module" src="static/js/app.js?v={{VERSION}}"></script>
  </head>
  <body>
    <div id="app" class="is-booting">
      <div class="boot" role="status" aria-live="polite">
        <span class="spinner" style="--spinner-size: 30px" aria-hidden="true"></span>
        <p>Wczytuję biblioteczkę…</p>
        <p class="boot-slow">
          To trwa dłużej niż zwykle. Sprawdź połączenie z Home Assistant albo odśwież stronę.
        </p>
      </div>
      <noscript>
        <p class="boot">Biblioteczka potrzebuje włączonej obsługi JavaScriptu.</p>
      </noscript>
    </div>
  </body>
</html>
