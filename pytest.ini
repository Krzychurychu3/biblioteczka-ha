# Konfiguracja pytest dla testów w tests/ (uruchamianych z katalogu głównego repozytorium: .venv/bin/python -m pytest -q).
[pytest]
testpaths = tests
# Jawny zakres pętli zdarzeń dla asynchronicznych fixture'ów (pytest-asyncio): bez tego ustawienia
# pytest-asyncio zgłasza PytestDeprecationWarning, a przebieg z `-W error::DeprecationWarning` kończy się błędem.
asyncio_default_fixture_loop_scope = function
